name: Build slides

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile the example slides
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.13.1"

      - name: Build
        run: typst compile main.typ scu-beamer-demo.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: scu-beamer-demo
          path: scu-beamer-demo.pdf

      - name: Attach PDF to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: scu-beamer-demo.pdf
